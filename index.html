<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Lablab ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0908;--body:#c9b99a;--body2:#a89a7d;--btn:#e4d9c0;--ink:#3b3226;--pink:#d94f77;--paper:#f3ead6;--screen:#15151a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#241915,var(--bg) 70%);color:var(--btn);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:440px;padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center;position:relative}
.tv{width:100%;background:linear-gradient(160deg,var(--body),var(--body2));border-radius:34px;padding:20px 20px 16px;box-shadow:0 30px 60px #000a,inset 0 2px 0 #fff4}
.screen{position:relative;aspect-ratio:4/3;border-radius:22px;background:var(--screen);border:8px solid #2a211b;overflow:hidden;box-shadow:inset 0 0 40px #000}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.scene.on{opacity:1}
.fig{position:absolute;bottom:18%;width:15%;height:46%;border-radius:50% 50% 8% 8%/30% 30% 8% 8%;filter:blur(5px);opacity:.75}
#vid{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;filter:sepia(.3) saturate(.9) contrast(1.05)}
#vid.on{display:block}
#vid{pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px);pointer-events:none;z-index:3}
.glitch{position:absolute;left:0;right:0;height:3px;background:#fff6;z-index:3;animation:gl 3s linear infinite}
@keyframes gl{0%{top:-5%}100%{top:105%}}
.osd{position:absolute;z-index:4;font-family:"Courier New",monospace;letter-spacing:.15em;font-size:13px;color:#eee;text-shadow:0 0 6px #fff6}
.osd.tl{top:12px;left:14px}.osd.tr{top:12px;right:14px}
.date{bottom:52px;left:14px}
.cap{position:absolute;z-index:4;left:14px;right:14px;bottom:26px;font-style:italic;font-size:16px;color:#fff;text-shadow:0 1px 6px #000}
.bar{position:absolute;z-index:4;left:14px;right:14px;bottom:14px;height:3px;background:#fff3}
.bar i{display:block;height:100%;width:0;background:#ff6b8a}
.count{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:var(--screen)}
.count.on{display:flex}
.count:before{content:"";position:absolute;width:62%;aspect-ratio:1;border:2px solid #fff7;border-radius:50%;box-shadow:inset 0 0 0 18px #0000,0 0 0 14px #0000}
.count:after{content:"";position:absolute;inset:0;background:linear-gradient(#fff5,#fff5) center/2px 100% no-repeat,linear-gradient(#fff5,#fff5) center/100% 2px no-repeat}
.count b{font-size:92px;font-weight:700;color:#eee;position:relative;z-index:1}
.count span{position:absolute;bottom:14%;font-family:Caveat,cursive;font-size:26px;color:#fffa;z-index:1}
.idle-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace;letter-spacing:.3em;color:#fff5;font-size:13px;z-index:2}
.deck{margin-top:16px;background:#bcad8e;border-radius:20px;padding:14px 14px 10px;box-shadow:inset 0 2px 0 #fff3}
.slot{height:16px;background:#0b0907;border-radius:6px;box-shadow:inset 0 3px 6px #000}
.lbl{text-align:center;font-size:10px;letter-spacing:.3em;color:#6b5f4a;margin:12px 0}
.ctrl{display:flex;align-items:center;gap:8px;background:#a89a7d;padding:8px;border-radius:14px}
.led{width:12px;height:12px;border-radius:50%;background:#4a4036;flex:none;margin:0 4px}
.led.on{background:#ff3b30;box-shadow:0 0 10px #ff3b30}
.ctrl button{flex:1;height:42px;border:0;border-radius:9px;background:var(--btn);color:var(--ink);font-size:15px;cursor:pointer;box-shadow:0 3px 0 #8d7f63;transition:transform .08s}
.ctrl button:active,.ctrl button.act{transform:translateY(2px);box-shadow:0 1px 0 #8d7f63}
.ctrl hr{width:1px;height:30px;border:0;background:#0003;margin:0 2px}
.brand{text-align:center;font-size:10px;letter-spacing:.4em;color:#6b5f4a;margin-top:10px}
.shelf{width:100%;height:150px;position:relative;margin-top:22px;display:flex;flex-direction:column;align-items:center}
.tape{width:230px;height:120px;background:#14121a;border-radius:6px;padding:12px;position:absolute;top:0;transition:transform 1.1s cubic-bezier(.6,0,.3,1),opacity .4s 1s;box-shadow:0 12px 24px #000a;transform:perspective(500px) rotateX(18deg)}
.tape.in{transform:translateY(-330px) scale(.7);opacity:0}
.tape .l{background:var(--paper);height:62px;border-radius:3px;padding:6px 10px;color:#222;font-family:Caveat,cursive;line-height:1}
.tape .l b{font-size:24px;font-weight:600;display:block}.tape .l small{font-size:14px;color:#777}
.reels{display:flex;justify-content:space-between;padding:10px 24px}
.reels i{width:26px;height:26px;border-radius:50%;background:#050505;border:5px solid #333}
.ins{position:absolute;bottom:0;border:0;background:var(--pink);color:#fff;font-weight:700;letter-spacing:.18em;font-size:13px;padding:16px 34px;border-radius:30px;cursor:pointer;box-shadow:0 0 28px #d94f7766;transition:opacity .3s}
.ins.hide{opacity:0;pointer-events:none}
.letter{position:fixed;inset:0;background:#0d0908ee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:28px;padding:24px;z-index:10;opacity:0;transition:opacity 1s}
.letter.on{display:flex}.letter.show{opacity:1}
.paper{background:var(--paper);color:#2c2a26;max-width:420px;width:100%;padding:34px 30px;border-radius:4px;transform:rotate(-1.5deg);box-shadow:0 20px 50px #000;font-family:Caveat,cursive;font-size:22px;line-height:1.5;max-height:68vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background-image:repeating-linear-gradient(transparent 0 38px,#0001 38px 39px)}
.paper h2{font-weight:600;font-size:36px;margin:0 0 10px}
.paper p{margin:0 0 14px}.paper::-webkit-scrollbar{display:none}.paper .sig{text-align:right;margin:0}
.again{background:none;border:0;border-bottom:1px solid #fff5;color:#fff8;font-size:13px;letter-spacing:.3em;padding:6px 0;cursor:pointer}
.scene img,.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.35) saturate(.9) contrast(1.05)}
@media (prefers-reduced-motion:reduce){.glitch{animation:none}}
</style>
</head>
<body>
<main>
 <div class="tv">
  <div class="screen" id="screen">
   <div class="idle-msg" id="idle">NO TAPE</div>
   <div id="scenes"></div>
   <div class="count" id="count"><b id="n">3</b><span id="to"></span></div>
   <canvas id="vid" width="640" height="480"></canvas>
   <div class="scan"></div><div class="glitch"></div>
   <div class="osd tl" id="mode" hidden>&#9654; PLAY</div>
   <div class="osd tr" id="tc" hidden>00:00</div>
   <div class="osd date" id="date" hidden></div>
   <div class="cap" id="cap"></div>
   <div class="bar" id="barw" hidden><i id="bar"></i></div>
  </div>
  <div class="deck">
   <div class="slot"></div>
   <div class="lbl">VIDEO CASSETTE</div>
   <div class="ctrl">
    <span class="led" id="led"></span>
    <button id="rw" aria-label="Rewind">&#9664;&#9664;</button>
    <button id="pl" aria-label="Play">&#9654;</button>
    <button id="pa" aria-label="Pause">&#10074;&#10074;</button>
    <button id="ff" aria-label="Fast forward">&#9654;&#9654;</button>
    <button id="ej" aria-label="Eject">&#9650;</button>
    <hr>
    <button id="mu" aria-label="Music">&#9835;</button>
   </div>
  </div>
  <div class="brand">LOVECAPSULE</div>
 </div>
 <div class="shelf">
  <div class="tape" id="tape"><div class="l"><b id="tl">ours</b><small id="ts"></small></div><div class="reels"><i></i><i></i></div></div>
  <button class="ins" id="ins">INSERT CASSETTE</button>
 </div>
</main>
<div class="letter" id="letter">
 <div class="paper" id="paper"></div>
 <button class="again" id="again">PLAY IT AGAIN</button>
</div>
<script>
// ====== EDIT ME: make it yours ======
const CAPSULE = {
  to: "Lablab",
  tapeTitle: "ours",
  tapeDates: "April 17 – November 17",
  video: "memory.mp4",   // put your video in the same folder as this file
  secondsPerScene: 5,
  scenes: [
    {date:"JUN 14 1998", text:"the first night we talked until sunrise", sky:["#2b1d3a","#e08a5a"]},
    {date:"JUL 09 1998", text:"you laughed at my terrible map reading", sky:["#1d3a4a","#f0c27a"]},
    {date:"AUG 02 1998", text:"we missed the last ferry", sky:["#3a2a3f","#e9946b"]},
    {date:"DEC 24 1998", text:"snow on the car, your hand in mine", sky:["#1b2433","#8fa6c4"]}
  ],
  letter: {
    title: "🖤🖤🖤",
    paragraphs: [
      "Hi lablab, there is one thing I can assure you, lablab ko, is that I will love you for a lifetime, even through the hardest times.",
      "I will love you not just when everything is perfect, but especially when life gets difficult, when the days feel uncertain, and when things don’t go as planned. Because for me, love isn’t just about staying when everything is easy. It’s about choosing you even when the road gets rough.",
      "Kaya nga naniniwala ako na ang tunay na nagmamahal, hindi naghihintay na tumila ang ulan bago mangarap ng habang buhay. Madaling mangako kapag maliwanag ang langit, pero mas mahalaga ang pananatili kahit makulimlim ito.",
      "I don’t need every day to be sunny. Gusto lang kitang makasama sa paglalakad, kahit minsan ay mabasa tayo ng ulan, basta magkasama nating haharapin ang bawat unos.",
      "And at the end of all these dreams, there’s a simple home I always pray for you, me, and Kiel. A life filled with warmth, laughter, comfort, and love. Hindi man perpekto, pero payapa at masaya.",
      "Dahil ang hinihiling ko lang ay dumating ang araw na hindi na natin kailangang mangarap sa ilalim ng ulan, dahil magkasama na nating nasisilayan ang sikat ng araw.",
      "Happy monthsary Langga. Whatever season life brings, I hope you never doubt how much you and Kiel mean to me. I love you so much langlang ko. Ikaw at si Kiel ang isa sa pinaka magandang dumating sa buhay ko ❤️🥰"
    ],
    sign: ""
  }
};
// ====================================
const $=id=>document.getElementById(id);
let S=CAPSULE.scenes, TOTAL=0, MEDIA=[], VMODE=false; const D=CAPSULE.secondsPerScene;
let state="idle", t=0, timer=null, dir=1, speed=1;

const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SKY=["#2b1d3a","#e08a5a"];
function apply(){
  const C=CAPSULE;
  $("tl").textContent=C.tapeTitle; $("ts").textContent=C.tapeDates; $("to").textContent="for "+C.to;
  TOTAL=S.length*D;
  $("scenes").innerHTML=S.map((sc,i)=>{
    const m=MEDIA[i];
    if(m&&m.type.startsWith("video"))return `<div class="scene"><video src="${m.url}" muted loop autoplay playsinline></video></div>`;
    if(m)return `<div class="scene"><img src="${m.url}" alt=""></div>`;
    const k=sc.sky||SKY;
    return `<div class="scene" style="background:linear-gradient(${k[0]} 0%,${k[1]} 55%,#2a2a33 56%,#14141a 100%)"><span class="fig" style="left:34%;background:#e8d9cc"></span><span class="fig" style="left:52%;height:52%;background:#7a6a5c"></span></div>`;
  }).join("");
  $("paper").innerHTML=`<h2>${esc(C.letter.title)}</h2>`+C.letter.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")+`<p class="sig">${esc(C.letter.sign)}</p>`;
}
apply();
const V=$("vid"),cx=V.getContext("2d");
// The video is never "played" (iPhone would force full screen). Instead a hidden
// copy is seeked frame by frame onto a canvas, and a separate audio element gives the sound.
const vs=document.createElement("video"), aud=new Audio();
vs.muted=true;vs.playsInline=true;vs.preload="auto";vs.setAttribute("playsinline","");vs.setAttribute("webkit-playsinline","");
vs.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
document.body.appendChild(vs); aud.preload="auto";
let seeking=false, loopOn=false;
function draw(){
  if(!vs.videoWidth)return;
  const cw=V.width,ch=V.height,k=Math.max(cw/vs.videoWidth,ch/vs.videoHeight),w=vs.videoWidth*k,h=vs.videoHeight*k;
  cx.drawImage(vs,(cw-w)/2,(ch-h)/2,w,h);
}
vs.onseeked=()=>{seeking=false;draw()};
vs.onloadeddata=draw;
function loop(){
  if(VMODE&&(state==="play"||state==="pause")){
    if(state==="play"&&dir>0&&!aud.paused)t=aud.currentTime;
    if(!seeking&&Math.abs(vs.currentTime-t)>0.03){seeking=true;try{vs.currentTime=t}catch(e){seeking=false}}
    requestAnimationFrame(loop);
  }else loopOn=false;
}
function vsync(){
  if(!VMODE)return;
  const live=state==="play"||state==="pause";
  V.classList.toggle("on",live);
  if(state==="play"&&dir>0){
    if(Math.abs(aud.currentTime-t)>0.3)aud.currentTime=t;
    aud.playbackRate=speed>1?3:1;aud.play().catch(()=>{});
  }else aud.pause();
  if(live&&!loopOn){loopOn=true;requestAnimationFrame(loop)}
}
function vz(){if(VMODE){aud.currentTime=0;try{vs.currentTime=0}catch(e){}}}
if(CAPSULE.video){
  vs.onloadedmetadata=()=>{VMODE=true;TOTAL=vs.duration||TOTAL};
  vs.onerror=()=>{VMODE=false};
  vs.src=CAPSULE.video; aud.src=CAPSULE.video;
}
const pad=n=>String(n).padStart(2,"0");
function render(){
  if(VMODE){$("date").textContent="";$("cap").textContent="";document.querySelectorAll(".scene").forEach(e=>e.classList.remove("on"));$("tc").textContent=pad(Math.floor(t/60))+":"+pad(Math.floor(t%60));$("bar").style.width=(t/TOTAL*100)+"%";return}
  const i=Math.min(S.length-1,Math.floor(t/D));
  document.querySelectorAll(".scene").forEach((e,k)=>e.classList.toggle("on",k===i&&state!=="idle"&&state!=="count"));
  $("date").textContent=S[i].date; $("cap").textContent=S[i].text;
  $("tc").textContent=pad(Math.floor(t/60))+":"+pad(Math.floor(t%60));
  $("bar").style.width=(t/TOTAL*100)+"%";
}
function ui(){
  const live=state==="play"||state==="pause";
  ["mode","tc","date","barw"].forEach(id=>$(id).hidden=!live);
  $("cap").style.display=live?"block":"none";
  $("idle").style.display=state==="idle"?"flex":"none";
  $("led").classList.toggle("on",state!=="idle");
  $("mode").innerHTML=state==="pause"?"&#10074;&#10074; PAUSE":speed>1?(dir>0?"&#9654;&#9654; FF":"&#9664;&#9664; REW"):"&#9654; PLAY";
  $("pl").classList.toggle("act",state==="play"&&speed===1);
  $("pa").classList.toggle("act",state==="pause");
  vsync();
}
function tick(){
  if(VMODE){
    if(dir<0){t=Math.max(0,t-0.6)}
    else if(state==="play"&&!aud.paused)t=aud.currentTime;
    if(dir<0&&t<=0){dir=1;speed=1;ui()}
    if(aud.ended||t>=TOTAL-0.1){stop();showLetter();return}
    render();return;
  }
  t+=dir*speed*0.1;
  if(t<0){t=0;dir=1;speed=1}
  if(t>=TOTAL){stop();showLetter();return}
  render();
}
function run(){clearInterval(timer);timer=setInterval(tick,100)}
function stop(){clearInterval(timer)}
function play(){if(state==="idle"||state==="count"||state==="letter")return;state="play";dir=1;speed=1;run();ui()}

$("ins").onclick=()=>{
  if(CAPSULE.video){aud.muted=false;vs.load();const pr=aud.play();if(pr)pr.then(()=>{aud.pause();aud.currentTime=0}).catch(()=>{})} // unlock playback on iPhone while the tap is fresh

  $("ins").classList.add("hide"); $("tape").classList.add("in"); state="count"; ui(); beep(180,.2);
  setTimeout(()=>{ $("idle").style.display="none"; $("count").classList.add("on"); let n=3; $("n").textContent=n; beep(440,.15);
    const c=setInterval(()=>{ n--; if(n<=0){clearInterval(c);$("count").classList.remove("on");t=0;vz();state="play";dir=1;speed=1;render();run();ui();beep(660,.3)}else{$("n").textContent=n;beep(440,.15)} },1000);
  },1300);
};
$("pl").onclick=play;
$("pa").onclick=()=>{if(state==="play"){state="pause";stop();ui()}else if(state==="pause")play()};
$("ff").onclick=()=>{if(state==="play"||state==="pause"){state="play";dir=1;speed=6;run();ui()}};
$("rw").onclick=()=>{if(state==="play"||state==="pause"){state="play";dir=-1;speed=6;run();ui()}};
$("ej").onclick=()=>{stop();state="idle";t=0;vz();$("letter").classList.remove("on","show");$("count").classList.remove("on");$("tape").classList.remove("in");$("ins").classList.remove("hide");document.querySelectorAll(".scene").forEach(e=>e.classList.remove("on"));ui()};
function showLetter(){state="letter";ui();const l=$("letter");l.classList.add("on");requestAnimationFrame(()=>requestAnimationFrame(()=>l.classList.add("show")))}
$("again").onclick=()=>{$("letter").classList.remove("on","show");t=0;vz();state="play";dir=1;speed=1;render();run();ui()};

// soft synth: beeps + optional ambient chord
let ac=null,amb=null;
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ac}
function beep(f,d){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type="sine";g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}
$("mu").onclick=()=>{
  if(VMODE){aud.muted=!aud.muted;$("mu").classList.toggle("act",aud.muted);return}
  if(false){if(audioEl.paused){audioEl.play();$("mu").classList.add("act")}else{audioEl.pause();$("mu").classList.remove("act")}return}
  const a=ctx();if(!a)return;
  if(amb){amb.forEach(o=>o.stop());amb=null;$("mu").classList.remove("act");return}
  const g=a.createGain();g.gain.value=.03;g.connect(a.destination);
  amb=[220,277.2,329.6,440].map(f=>{const o=a.createOscillator();o.type="triangle";o.frequency.value=f;o.connect(g);o.start();return o});
  $("mu").classList.add("act");
};
ui();
</script>
</body>
</html>
